<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e5f0ee" />
    <title>赛尔号 · 克洛斯星</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="experience">
      <canvas id="world" tabindex="0" aria-label="克洛斯星三维场景，点击地面行走，拖动环绕，滚轮缩放"></canvas>
      <div id="labels" aria-label="场景中的精灵和资源"></div>
      <header class="topbar">
        <a class="brand" href="./" aria-label="赛尔号"><span class="brand-emblem"><i data-lucide="orbit"></i></span><span><b>赛尔号<span class="brand-en">SEER</span></b><small>星际探索计划</small></span></a>
        <div class="location"><span class="location-icon"><i data-lucide="orbit"></i></span><div><span class="overline">帕诺星系 · PANO GALAXY</span><h1>克洛斯星</h1></div><span class="location-level">01</span></div>
        <div class="top-tools"><span class="live"><i></i>探索中</span><button class="icon-button" id="sound" title="开启环境音" aria-label="开启环境音" aria-pressed="false"><i data-lucide="volume-x"></i></button><button class="icon-button" id="fullscreen" title="全屏" aria-label="全屏"><i data-lucide="maximize"></i></button></div>
      </header>
      <aside class="mission">
        <div class="mission-heading"><span class="overline">EXPLORATION LOG</span><i data-lucide="radio"></i></div>
        <h2>初访克洛斯星</h2>
        <p class="mission-sub">每一次发现，都是新的冒险。</p>
        <div class="task" id="task-scan"><span class="task-check"><i data-lucide="scan-line"></i></span><div><b>记录当地精灵</b><small>皮皮 · 比波</small></div><span class="task-count" id="scan-count">0 / 2</span></div>
        <div class="task" id="task-crystal"><span class="task-check"><i data-lucide="gem"></i></span><div><b>采集黄晶矿</b><small>能源补给</small></div><span class="task-count" id="crystal-count">0 / 3</span></div>
        <div class="mission-progress"><span id="progress-bar"></span></div>
        <div class="mission-footer"><span>星球探索度</span><b id="progress">0%</b></div>
      </aside>
      <div class="area-stamp"><span class="stamp-line"></span><b>克洛斯星 · 草原</b><span>GRASSLAND / 01</span></div>
      <aside class="view-tools" aria-label="视角工具"><button class="icon-button" id="reset" title="复位视角" aria-label="复位视角"><i data-lucide="focus"></i></button><span></span><button class="icon-button" id="zoom-in" title="放大" aria-label="放大"><i data-lucide="plus"></i></button><button class="icon-button" id="zoom-out" title="缩小" aria-label="缩小"><i data-lucide="minus"></i></button></aside>
      <div class="bottom-hud">
        <div class="player-card"><div class="player-avatar"><i data-lucide="bot"></i></div><div><span class="overline">SEER NO. 0001</span><b>星际探索员</b><div class="energy"><span></span></div></div><span class="player-level">LV. 05</span></div>
        <nav class="dock" aria-label="探索菜单">
          <button data-panel="map"><i data-lucide="orbit"></i><span>星际地图</span></button>
          <button data-panel="dex"><i data-lucide="book-open"></i><span>精灵图鉴</span><span class="dot" id="dex-dot" hidden></span></button>
          <button id="scan" class="scan-button"><span><i data-lucide="scan-line"></i></span><b>探索扫描</b></button>
          <button data-panel="bag"><i data-lucide="backpack"></i><span>背包</span></button>
          <button data-panel="reference"><i data-lucide="image"></i><span>记忆相片</span></button>
        </nav>
        <div class="coordinate"><i data-lucide="navigation"></i><span><b id="coordinates">X 03.0 · Y 05.0</b><small>帕诺星系 / 克洛斯星</small></span></div>
      </div>
      <div class="scene-note">SEER · 非官方场景习作</div>
      <div id="toast" role="status" aria-live="polite" hidden></div>
      <div id="loading"><i data-lucide="orbit"></i><b>正在抵达克洛斯星</b><span>坐标锁定 · PANO 01</span></div>
      <dialog id="panel" aria-labelledby="panel-title"><div class="panel-header"><div><span class="overline" id="panel-kicker"></span><h2 id="panel-title"></h2></div><button class="icon-button" id="close-panel" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="panel-content"></div></dialog>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
