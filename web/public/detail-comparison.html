<script>
const scenes=[{"id": "home", "name": "摩尔家园", "ref": "home.jpg", "added": true, "notes": "右后紫瓦木屋、金色卷纹秋千、雕像喷泉与花圃、L形六格土垄；弧形厚屋檐、心形门窗和鹅卵石广场。"}, {"id": "homeinside", "name": "家园小屋", "ref": "homeinside.jpg", "added": true, "notes": "嫩绿花纹墙纸与藤蔓、奶油圆窗和晴天娃娃、花瓣吊灯；圣诞树、树桩鱼缸、粉色沙发床、条纹躺椅、橙瓣桌、玩偶、摇木马和卵石小池。"}, {"id": "playground", "name": "西部游乐场", "ref": "playground.jpg", "notes": "小丑红绿柜体与金色包边、独立笑脸、螺旋弹簧手臂与白手套、缝线软帽和金铃；巨树背面树根与树皮起伏。"}, {"id": "gamehut", "name": "游戏小屋", "ref": "gamehut.jpg", "notes": "保留前侧游戏机与透明夹娃娃机；补全后侧树皮厚壳、纵向木纹、树结和向四周分叉的树根。"}, {"id": "classroom", "name": "拉姆教室", "ref": "classroom.jpg", "added": true, "notes": "金棕木板与钉头、中央黄色拉姆地毯、左侧二层实验台和木楼梯、蓝色水柱、黑板与四格圆窗。"}, {"id": "church", "name": "爱心教堂", "ref": "church.jpg", "notes": "圆弧木楼、木板接缝与栏杆；救护门廊、悬钟、叶片塔顶、缎带及侧门徽章；蓝天白云。"}, {"id": "castle", "name": "摩尔城堡", "ref": "castle.jpg", "notes": "保留圆弧布局，深暖灰石块、鹅卵石凹凸；赭金后拱桥、四面蓝灰后堡、书塔环绕14个实体拱窗及蓝瓦锥塔。"}, {"id": "hall", "name": "城堡大厅", "ref": "hall.jpg", "added": true, "notes": "雕花拱龛、粉色垂幔、青金吊灯、三层花瓣台阶与薄荷粉王座；M纹地砖、花瓶、曲面接待台。"}, {"id": "study", "name": "二楼书房", "ref": "study.jpg", "added": true, "notes": "深木书柜与六座奖杯、四组双椅圆桌、天蓝拱窗、窗帘、落地钟、书梯和花纹地板。"}, {"id": "street", "name": "淘淘乐街", "ref": "street.jpg", "notes": "GIFTS 与 DRESS 之间的双层弧形白栏杆、石沿及绿色售货机；粉屋错层楼梯、铲子吊牌；双扇玻璃木门、小丑徽章；PETS 拱形玻璃屋、独立花台、弯木椅与圆角石板。"}, {"id": "beach", "name": "阳光海滩", "ref": "beach.jpg", "notes": "灰紫色大石板、沙地与海水层次；三阶弧形海岸、潜艇舷窗和前景海藻。"}, {"id": "farm", "name": "摩尔农场", "ref": "farm.jpg", "notes": "农舍放大并向中央收拢、菜地内移、屋前石路衔接；门环、拱石、木纹、绑绳与补丁短裤；麦田后方奶油色城堡和柔和彩虹。"}, {"id": "ranch", "name": "开心牧场", "ref": "ranch.png", "notes": "向右下延伸的水域和单侧石岸；四瓣水槽、编织提篮、蓝瓦风车和草棚。"}, {"id": "ram", "name": "拉姆学院", "ref": "ram.jpg", "notes": "巨树、环形曲梯与阶地；左侧蓝屋顶木屋门前可以进入拉姆教室。"}];let active=scenes.find(s=>s.id===location.hash.slice(1))||scenes[0],before=false;
const $=id=>document.getElementById(id);const nav=document.querySelector('nav');for(const scene of scenes){const b=document.createElement('button');b.textContent=scene.name;b.dataset.scene=scene.id;b.onclick=()=>{active=scene;history.replaceState(null,'','#'+scene.id);render()};nav.append(b)}
function render(){if(active.added)before=false;$('before').disabled=Boolean(active.added);for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.scene===active.id));$('name').textContent=active.name;$('notes').textContent=active.notes;$('source').src='references/'+active.ref;$('render').src='comparison/'+active.id+(before?'-before.jpg':'-after.jpg');$('render-label').textContent=before?'本轮修正前的 3D 画面':'当前 3D 默认视角';$('enter').href='摩尔庄园.html#'+active.id;$('version').setAttribute('aria-pressed',String(!before));$('before').setAttribute('aria-pressed',String(before))}
$('version').onclick=()=>{before=false;render()};$('before').onclick=()=>{before=true;render()};$('focus').onclick=()=>{const on=document.body.classList.toggle('focus');$('focus').setAttribute('aria-pressed',String(on));$('focus').textContent=on?'并排对照':'放大模型'};render();
</script></html>
